name: teachers_app
description: School-OS Teacher Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  fl_chart: ^0.65.0
  table_calendar: ^3.0.9
  path_provider: ^2.1.1
  google_fonts: ^6.1.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  just_audio: ^0.9.36  # for playing voice announcements with better codec support
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
