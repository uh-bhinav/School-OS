<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Recognition Test</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px 5px;
      border-radius: 8px;
      border: none;
    }
    #startBtn {
      background: #3b82f6;
      color: white;
    }
    #startBtn:disabled {
      background: #94a3b8;
    }
    #stopBtn {
      background: #ef4444;
      color: white;
    }
    #status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      background: #f1f5f9;
    }
    #transcript {
      min-height: 100px;
      padding: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
    }
    .error {
      background: #fee2e2 !important;
      color: #dc2626;
    }
    .success {
      background: #dcfce7 !important;
      color: #16a34a;
    }
    .listening {
      background: #dbeafe !important;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>🎤 Speech Recognition Test</h1>

  <div id="support"></div>

  <div>
    <button id="startBtn">🎤 Start Recording</button>
    <button id="stopBtn">⏹️ Stop Recording</button>
  </div>

  <div id="status">Ready. Click "Start Recording" and speak.</div>

  <h3>Transcript:</h3>
  <div id="transcript">Your speech will appear here...</div>

  <h3>Debug Log:</h3>
  <pre id="log" style="background:#1e293b;color:#22c55e;padding:15px;border-radius:8px;max-height:200px;overflow:auto;font-size:12px;"></pre>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const logEl = document.getElementById('log');
    const supportEl = document.getElementById('support');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
      console.log(msg);
    }

    // Check support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      supportEl.innerHTML = '<div class="error" style="padding:15px;border-radius:8px;">❌ Speech Recognition NOT supported in this browser. Use Chrome or Edge.</div>';
      startBtn.disabled = true;
      log('ERROR: No SpeechRecognition API found');
    } else {
      supportEl.innerHTML = '<div class="success" style="padding:15px;border-radius:8px;margin-bottom:20px;">✅ Speech Recognition IS supported!</div>';
      log('Speech API available: ' + (window.SpeechRecognition ? 'SpeechRecognition' : 'webkitSpeechRecognition'));
    }

    let recognition = null;
    let finalTranscript = '';

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      log('Recognition instance created');

      recognition.onstart = () => {
        log('✓ onstart fired');
        statusEl.textContent = '🎤 Listening... Speak now!';
        statusEl.className = 'listening';
        startBtn.disabled = true;
      };

      recognition.onend = () => {
        log('✓ onend fired');
        statusEl.textContent = 'Stopped. Click Start to record again.';
        statusEl.className = '';
        startBtn.disabled = false;
      };

      recognition.onerror = (event) => {
        log(`✗ ERROR: ${event.error} (${event.message || 'no message'})`);
        statusEl.textContent = `Error: ${event.error}`;
        statusEl.className = 'error';
        startBtn.disabled = false;

        if (event.error === 'network') {
          statusEl.textContent = '❌ NETWORK ERROR - This usually means:\n1. No internet\n2. VPN blocking Google\n3. Browser restricting API';
        }
      };

      recognition.onresult = (event) => {
        let interim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            finalTranscript += result[0].transcript;
            log('Final result: ' + result[0].transcript);
          } else {
            interim += result[0].transcript;
          }
        }

        transcriptEl.textContent = finalTranscript + (interim ? ' [' + interim + ']' : '');
        log('Transcript updated');
      };

      recognition.onspeechstart = () => log('✓ onspeechstart fired');
      recognition.onspeechend = () => log('✓ onspeechend fired');
      recognition.onaudiostart = () => log('✓ onaudiostart fired');
      recognition.onaudioend = () => log('✓ onaudioend fired');
      recognition.onsoundstart = () => log('✓ onsoundstart fired');
      recognition.onsoundend = () => log('✓ onsoundend fired');
    }

    startBtn.onclick = () => {
      if (!recognition) return;
      finalTranscript = '';
      transcriptEl.textContent = 'Listening...';
      log('Starting recognition...');
      try {
        recognition.start();
        log('start() called successfully');
      } catch (e) {
        log('start() threw: ' + e.message);
      }
    };

    stopBtn.onclick = () => {
      if (!recognition) return;
      log('Stopping recognition...');
      recognition.stop();
    };
  </script>
</body>
</html>
